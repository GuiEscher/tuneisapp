name: tuneisappflutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  http_parser: ^4.0.2
  path_provider: ^2.1.5
  video_player: ^2.9.1
  photo_view: ^0.15.0
  archive: ^3.6.1
  pdf: ^3.11.3
  open_file: ^3.5.10
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/drone.png
    - assets/fonts/Poppins-Regular.ttf
    - assets/fonts/Poppins-Bold.ttf